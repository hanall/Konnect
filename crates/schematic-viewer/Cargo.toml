[package]
name = "schematic-viewer"
version = "0.13.0+hanall.1"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[[bin]]
name = "schematic-viewer"
path = "src/main.rs"

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.4.3"
tempfile = "=3.27.0"
# 독립 workspace이므로 내부 schematic engine을 명시적 path로 참조한다.
konnect-schematic-editor = { path = "../konnect-schematic-editor" }
