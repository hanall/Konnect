<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Konnect Schematic Viewer</title>
  <style nonce="__CSP_NONCE__">
    :root { color-scheme: dark; --bg:#11151b; --bar:#1a2029; --line:#334050; --text:#e8edf3; --dim:#9ba8b8; --accent:#5cb8ff; --danger:#ff8095; --button:#25303d; }
    body.light { color-scheme:light; --bg:#eef2f6; --bar:#fff; --line:#c4ceda; --text:#17202b; --dim:#5d6b7b; --accent:#006fbd; --danger:#b4233d; --button:#e3eaf1; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:14px system-ui,sans-serif; }
    body { display:flex; flex-direction:column; }
    #toolbar { min-height:44px; display:flex; gap:8px; align-items:center; padding:6px 10px; background:var(--bar); border-bottom:1px solid var(--line); }
    #filename { color:var(--accent); font-weight:650; max-width:24vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #status { color:var(--dim); max-width:26vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #toolbar .spacer { flex:1; }
    button, select { border:1px solid var(--line); border-radius:5px; background:var(--button); color:var(--text); padding:5px 10px; }
    button { cursor:pointer; }
    button:hover { border-color:var(--accent); }
    #sheet-selector { max-width:280px; }
    #sheet-selector[hidden] { display:none; }
    #zoom { color:var(--dim); min-width:58px; text-align:center; }
    #viewer { position:relative; flex:1; overflow:hidden; cursor:grab; }
    #viewer.dragging { cursor:grabbing; }
    #sheet-image { position:absolute; transform-origin:0 0; max-width:none; max-height:none; user-select:none; -webkit-user-drag:none; }
    body:not(.light) #sheet-image { filter:invert(.85) hue-rotate(180deg); }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--dim); pointer-events:none; }
    .overlay[hidden] { display:none; }
    .spinner { width:38px; height:38px; margin-bottom:12px; border:4px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #flash { position:fixed; top:54px; left:50%; transform:translateX(-50%); z-index:10; max-width:80vw; padding:10px 18px; border:1px solid var(--accent); border-radius:6px; background:var(--bar); color:var(--accent); opacity:0; transition:opacity .2s; pointer-events:none; white-space:pre-wrap; text-align:center; }
    #flash.visible { opacity:1; }
    #flash.error { color:var(--danger); border-color:var(--danger); }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="filename">Loading...</span>
    <select id="sheet-selector" hidden></select>
    <span id="status">Connecting...</span>
    <span class="spacer"></span>
    <button id="zoom-in" type="button" title="Zoom in (+)">Zoom +</button>
    <button id="zoom-out" type="button" title="Zoom out (-)">Zoom -</button>
    <span id="zoom">100%</span>
    <button id="fit" type="button" title="Fit to window (0)">Fit</button>
    <button id="refresh" type="button" title="Render from a new isolated snapshot (R)">Refresh</button>
    <button id="theme" type="button">Theme</button>
    <button id="open-kicad" type="button">Open in KiCad</button>
  </div>
  <div id="viewer">
    <img id="sheet-image" alt="Rendered schematic" hidden>
    <div id="empty" class="overlay"><strong>Konnect Schematic Viewer</strong><span>Waiting for an isolated render</span></div>
    <div id="loading" class="overlay" hidden><div class="spinner"></div><span id="loading-text">Rendering...</span></div>
  </div>
  <div id="flash"></div>
  <script nonce="__CSP_NONCE__">
    'use strict';
    const viewer = document.getElementById('viewer');
    const image = document.getElementById('sheet-image');
    const selector = document.getElementById('sheet-selector');
    const filename = document.getElementById('filename');
    const statusEl = document.getElementById('status');
    const zoomEl = document.getElementById('zoom');
    const empty = document.getElementById('empty');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const flashEl = document.getElementById('flash');
    let state = null, revision = -1, selectedFile = null, selectedId = 0;
    let scale = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;
    let currentObjectUrl = null, flashTimer = null, pollTimer = null, loadSequence = 0, browserReadySent = false;
    const clamp = value => Math.min(40, Math.max(.05, value));

    function flash(message, error=false, sticky=false) {
      flashEl.textContent = message;
      flashEl.classList.toggle('error', error);
      flashEl.classList.add('visible');
      if (flashTimer) clearTimeout(flashTimer);
      if (!sticky) flashTimer = setTimeout(() => flashEl.classList.remove('visible'), error ? 6000 : 1800);
    }
    function showLoading(message) { loadingText.textContent = message; loading.hidden = false; empty.hidden = true; }
    function hideLoading() { loading.hidden = true; }
    function transform() {
      image.style.width = `${image.naturalWidth * scale}px`;
      image.style.height = `${image.naturalHeight * scale}px`;
      image.style.transform = `translate(${panX}px,${panY}px)`;
      zoomEl.textContent = `${Math.round(scale * 100)}%`;
    }
    function fit() {
      if (!image.naturalWidth || !image.naturalHeight) return;
      scale = clamp(Math.min(viewer.clientWidth / image.naturalWidth, viewer.clientHeight / image.naturalHeight) * .95);
      panX = (viewer.clientWidth - image.naturalWidth * scale) / 2;
      panY = (viewer.clientHeight - image.naturalHeight * scale) / 2;
      transform();
    }
    function zoomAt(factor, x, y) {
      const next = clamp(scale * factor);
      panX = x - (x - panX) * next / scale;
      panY = y - (y - panY) * next / scale;
      scale = next;
      transform();
    }
    async function checkedFetch(path, options={}) {
      const response = await fetch(path, {cache:'no-store', ...options});
      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;
        try { message = (await response.json()).error || message; } catch (_) {}
        throw new Error(message);
      }
      return response;
    }
    async function loadSvg(fitAfter) {
      const sheet = state && state.sheets.find(item => item.id === selectedId);
      if (!sheet || !sheet.rendered) {
        image.hidden = true;
        empty.hidden = false;
        return;
      }
      const sequence = ++loadSequence;
      showLoading('Loading isolated SVG...');
      const response = await checkedFetch(`api/svg?id=${selectedId}`);
      const objectUrl = URL.createObjectURL(await response.blob());
      if (sequence !== loadSequence) { URL.revokeObjectURL(objectUrl); return; }
      const previous = currentObjectUrl;
      currentObjectUrl = objectUrl;
      image.onload = () => {
        if (sequence !== loadSequence) return;
        image.hidden = false;
        hideLoading();
        if (fitAfter) fit(); else transform();
        if (previous) URL.revokeObjectURL(previous);
        if (!browserReadySent) {
          browserReadySent = true;
          checkedFetch('api/browser-ready', {method:'POST'}).catch(error => {
            browserReadySent = false;
            flash('Viewer readiness acknowledgement failed: ' + error, true);
          });
        }
      };
      image.onerror = () => { if (sequence === loadSequence) { hideLoading(); flash('Browser rejected the rendered SVG', true); } };
      image.src = objectUrl;
    }
    function populateSheets(next) {
      const prior = selectedFile;
      selector.replaceChildren();
      for (const sheet of next.sheets) {
        const option = document.createElement('option');
        option.value = String(sheet.id);
        option.textContent = `${'\u00a0\u00a0\u00a0\u00a0'.repeat(sheet.depth)}${sheet.depth ? '|- ' : ''}${sheet.name}${sheet.rendered ? '' : ' [render failed]'}`;
        selector.appendChild(option);
      }
      const chosen = next.sheets.find(item => item.file === prior) || next.sheets[0];
      if (chosen) { selectedId = chosen.id; selectedFile = chosen.file; selector.value = String(chosen.id); }
      selector.hidden = next.sheets.length <= 1;
      filename.textContent = next.root_file.split(/[\\/]/).pop();
    }
    async function poll() {
      try {
        const next = await (await checkedFetch('api/state')).json();
        const changed = next.revision !== revision;
        const priorFile = selectedFile;
        if (changed) {
          populateSheets(next);
          state = next;
          revision = next.revision;
          statusEl.textContent = next.status === 'rendering' ? 'Change detected - rendering isolated snapshot...' : next.status;
          if (next.status === 'rendering') showLoading('Change detected - rendering isolated snapshot...');
          else {
            const messages = [...next.errors, ...next.warnings];
            if (messages.length) flash(messages.join('\n'), next.errors.length > 0);
            await loadSvg(priorFile !== selectedFile || image.hidden);
          }
        }
      } catch (error) {
        statusEl.textContent = 'Disconnected';
        flash(String(error), true);
      } finally {
        pollTimer = setTimeout(poll, 500);
      }
    }
    selector.addEventListener('change', async () => {
      selectedId = Number(selector.value);
      const sheet = state.sheets.find(item => item.id === selectedId);
      selectedFile = sheet && sheet.file;
      try { await loadSvg(true); } catch (error) { flash(String(error), true); }
    });
    document.getElementById('zoom-in').addEventListener('click', () => zoomAt(1.25, viewer.clientWidth/2, viewer.clientHeight/2));
    document.getElementById('zoom-out').addEventListener('click', () => zoomAt(.8, viewer.clientWidth/2, viewer.clientHeight/2));
    document.getElementById('fit').addEventListener('click', fit);
    document.getElementById('theme').addEventListener('click', () => document.body.classList.toggle('light'));
    document.getElementById('refresh').addEventListener('click', async () => {
      try { showLoading('Rendering a new isolated snapshot...'); await checkedFetch(`api/refresh?id=${selectedId}`, {method:'POST'}); flash('Refresh complete'); }
      catch (error) { hideLoading(); flash(String(error), true); }
    });
    document.getElementById('open-kicad').addEventListener('click', async () => {
      try { await checkedFetch(`api/open-kicad?id=${selectedId}`, {method:'POST'}); flash('KiCad launch accepted'); }
      catch (error) { flash(String(error), true); }
    });
    viewer.addEventListener('wheel', event => { event.preventDefault(); const box=viewer.getBoundingClientRect(); zoomAt(event.deltaY<0?1.1:.9,event.clientX-box.left,event.clientY-box.top); }, {passive:false});
    viewer.addEventListener('mousedown', event => { dragging=true; startX=event.clientX-panX; startY=event.clientY-panY; viewer.classList.add('dragging'); });
    window.addEventListener('mousemove', event => { if (!dragging) return; panX=event.clientX-startX; panY=event.clientY-startY; transform(); });
    window.addEventListener('mouseup', () => { dragging=false; viewer.classList.remove('dragging'); });
    window.addEventListener('keydown', event => {
      if (event.key==='+' || event.key==='=') zoomAt(1.25,viewer.clientWidth/2,viewer.clientHeight/2);
      else if (event.key==='-') zoomAt(.8,viewer.clientWidth/2,viewer.clientHeight/2);
      else if (event.key==='0') fit();
      else if (event.key==='r' || event.key==='R') document.getElementById('refresh').click();
    });
    poll();
  </script>
</body>
</html>
